name: CI

on:
  push:
    branches: [main, "fix/**", "integration/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Smoke-test the CLI
        run: |
          node dist/cli.mjs validate examples/homebrew-pack
          printf 'quit\n' | node dist/cli.mjs build --no-color
